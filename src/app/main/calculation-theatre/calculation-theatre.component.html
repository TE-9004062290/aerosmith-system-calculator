<div class="calculation-theatre-header">Calculator for speech reinforcement</div>
<div class="calculation-theatre-container">
    <app-graphical-stage></app-graphical-stage>
    <div class="sidebar">
        <div class="calculation-theatre-title">
            IP Mic Calculator (TBD)
        </div>
        <div class="calculation-theatre-misc">
            <strong>Note: Any loudspeakers should be <br/> placed at least 3 meters away from <br/> the microphone array.</strong>
        </div>
        <div class="calculation-theatre-settings">
            <div class="calculation-theatre-setting">
                <app-radio-toggle
                    toggleLabel="Select measurement units"
                    leftLabel="Meters (m)"
                    rightLabel="Feet (ft)"
                    [leftOption]="MeasurementUnitsEnum.Meters"
                    [rightOption]="MeasurementUnitsEnum.Feet"
                    [(ngModel)]="calculatorService.measurementUnit">
                </app-radio-toggle>
            </div>
            <div class="calculation-theatre-setting">
                <app-radio-toggle
                    toggleLabel="Calculation Priority"
                    leftLabel="Audio quality"
                    rightLabel="Capture area"
                    leftOption="quality"
                    rightOption="capture-area"
                    [(ngModel)]="calculationPriority">
                </app-radio-toggle>
            </div>
        </div>
        <div class="calculation-theatre-inputs">
            <app-calculation-inputs></app-calculation-inputs>
        </div>
        <div @animateOutputArea *ngIf="showOutputs">        
            <app-calculation-outputs></app-calculation-outputs>
        </div>
        <button style="margin-top: 8px;" (click)="calculate()">Calculate</button>
    </div>
</div>
