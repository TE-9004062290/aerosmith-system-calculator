<div class="calculation-theatre-header">Calculator for speech reinforcement</div>
<div class="calculation-theatre-container">
    <div class="graphical-stage-wrapper">
        <app-graphical-stage></app-graphical-stage>
    </div>
    <div class="sidebar">
        <div class="calculation-theatre-title">
            Beamforming Microphone <br/> Array MAS-A100
        </div>
        <div class="calculation-theatre-misc">
            <strong>Note</strong>: Any loudspeakers should be <br/> placed at least 3 meters away from <br/> the microphone array.
        </div>
        <div class="calculation-theatre-settings">
            <div class="calculation-theatre-setting">
                <app-radio-toggle
                    toggleLabel="Select measurement units"
                    leftLabel="Meters (m)"
                    rightLabel="Feet (ft)"
                    [leftOption]="MeasurementUnitsEnum.Meters"
                    [rightOption]="MeasurementUnitsEnum.Feet"
                    [(ngModel)]="calculatorService.measurementUnit">
                </app-radio-toggle>
            </div>
            <div class="calculation-theatre-setting">
                <app-radio-toggle
                    toggleLabel="Calculation Priority"
                    leftLabel="Audio quality"
                    rightLabel="Capture area"
                    [leftOption]="CalculationPriorityEnum.AudioQuality"
                    [rightOption]="CalculationPriorityEnum.CaptureArea"
                    [(ngModel)]="calculatorService.calculationPriority">
                </app-radio-toggle>
            </div>
        </div>
        <div class="calculation-theatre-inputs">
            <app-calculation-inputs></app-calculation-inputs>
        </div>
        <div *ngIf="calculatorService.isDirty" class="btn btn-calculate" (click)="calculate()">
            Calculate
        </div>
        <div *ngIf="calculatorService.isPristine && calculatorService.hasFreshOutput" class="btn btn-disabled">
            Calculate
        </div>  
    </div>
    <div *ngIf="calculatorService.hasFreshOutput" class="output-wrapper">
        <app-calculation-outputs></app-calculation-outputs>
    </div>
</div>
