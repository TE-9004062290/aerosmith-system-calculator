<div class="checkbox-container" (click)="toggle()">
    <div class="checkbox-label">{{ label }}</div>
    <div class="radio-toggle-options">
        <div class="radio-toggle-option">
            <app-svg-icons [iconType]="selectedOption === 'left' ? 'radio-on' : 'radio-off'" class="radio-option"></app-svg-icons>
            <span class="radio-option-label">{{ leftLabel || leftOption }}</span>
        </div>
        <div class="radio-toggle-option">
            <app-svg-icons [iconType]="selectedOption === 'right' ? 'radio-on' : 'radio-off'" class="radio-option"></app-svg-icons>
            <span class="radio-option-label">{{ rightLabel || rightOption }}</span>
        </div>
    </div>
</div>
