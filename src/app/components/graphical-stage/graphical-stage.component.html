<div class="stage-info-wrapper">
    <div #wrapper class="stage-wrapper" [attr.app-display-mode]="RatioModeEnum[ratioMode] | lowercase">
        <div #container class="stage-container">
            <div #stage class="stage" [ngStyle]="{'height': stageHeight + 'px', 'width': stageWidth + 'px'}">
                <div class="person-wrapper" [ngStyle]="{'width': presenterWidthPercentage + 'px'}">
                    <app-svg-standing-person></app-svg-standing-person>
                </div>
                <div *ngFor="let mic of microphonePositions; trackBy: trackByFn" @animateOutputArea 
                    class="microphone-wrapper" 
                    [ngStyle]="{'width': captureWidthPercentage + '%', 'left': mic.positionPercentage + '%'}">
                    <app-svg-microphone [extenderLength]="extenderLength"></app-svg-microphone>
                </div>
            </div>
        </div>
    </div>
    <div style="position: absolute; top: 0; left: -8%">
        <app-measuring-stick orientation="vertical" [height]="stageHeight"
            [isInput]="true"
            [inputMin]="CalculatorMins.ceilingHeight"
            [inputMax]="CalculatorMaxes.ceilingHeight"
            [inputValue]="calculatorService.ceilingHeight"
            (updated)="updateInput('ceilingHeight', $event)"
        ></app-measuring-stick>
    </div>
    <app-measuring-stick orientation="horizontal" [width]="stageWidth"
        [isInput]="true" 
        [inputMin]="CalculatorMins.lectureWidth"
        [inputMax]="CalculatorMaxes.lectureWidth"
        [inputValue]="calculatorService.lectureWidth"
        (updated)="updateInput('lectureWidth', $event)"
    ></app-measuring-stick>
</div>
