<div class="graphical-output">
    <div class="graphical-output-front">
        <div class="stage-info-wrapper">
            <div style="position: absolute; top: 0; left: 10%;">
                <app-measuring-stick orientation="vertical" [height]="stageHeight"
                    [isInput]="true"
                    [inputMin]="CalculatorMins.ceilingHeight"
                    [inputMax]="CalculatorMaxes.ceilingHeight"
                    [inputValue]="calculatorService.ceilingHeight"
                    (updated)="updateInput('ceilingHeight', $event)"
                ></app-measuring-stick>
            </div>
            <div style="position: absolute; margin: 0 auto; bottom: -40px; width: 100%;">
                <app-measuring-stick orientation="horizontal" [width]="stageWidth"
                    [isInput]="true" 
                    [inputMin]="CalculatorMins.lectureWidth"
                    [inputMax]="CalculatorMaxes.lectureWidth"
                    [inputValue]="calculatorService.lectureWidth"
                    (updated)="updateInput('lectureWidth', $event)"
                ></app-measuring-stick>
            </div>
            <ng-container *ngIf="microphones.positions && microphones.positions.length % 2 === 0">
                <div style="position: absolute; margin: 0 auto; top: -40px; width: 100%;" @animateOutputArea >
                    <app-measuring-stick orientation="horizontal" [width]="calculatorService.microphoneInterval * stageWidth / calculatorService.lectureWidth"
                        [isInput]="false" 
                        [inputValue]="calculatorService.microphoneInterval"
                    ></app-measuring-stick>
                </div>
            </ng-container>
            <ng-container *ngIf="microphones.positions && microphones.positions.length % 2 === 1">
                <div style="position: absolute; top: -40px; width: 100%; display: flex; justify-content: center;" @animateOutputArea >
                    <app-measuring-stick orientation="horizontal" [width]="calculatorService.microphoneInterval * stageWidth / calculatorService.lectureWidth"
                    [isInput]="false" 
                    [inputValue]="calculatorService.microphoneInterval"
                    ></app-measuring-stick>
                    <app-measuring-stick orientation="horizontal" [width]="calculatorService.microphoneInterval * stageWidth / calculatorService.lectureWidth"
                        [isInput]="false" 
                        [inputValue]="calculatorService.microphoneInterval"
                    ></app-measuring-stick>
                </div>
            </ng-container>
            <div #wrapper class="stage-wrapper" [attr.app-display-mode]="RatioModeEnum[ratioMode] | lowercase">
                <div class="stage-outer-container">
                    <div #container class="stage-inner-container">
                        <div #stage class="stage" [ngStyle]="{'height': stageHeight + 'px', 'width': stageWidth + 'px'}">
                                <div style="position: absolute; bottom: 0;" [ngStyle]="{'left': 'calc(' + microphones.rightMost + 10 + '% + 75px)'}">
                                    <app-measuring-stick orientation="vertical" [height]="presenterWidth / graphicsService.presenterWidthHeight"
                                        [isInput]="true"
                                        [inputMin]="CalculatorMins.presenterHeight"
                                        [inputMax]="CalculatorMaxes.presenterHeight"
                                        [inputValue]="calculatorService.presenterHeight"
                                        (updated)="updateInput('presenterHeight', $event)"
                                    ></app-measuring-stick>
                                </div>
                                <div *ngIf="extenderLength" style="position: absolute; top: 0;" [ngStyle]="{'left': '100%'}" @animateOutputArea>
                                    <app-measuring-stick orientation="vertical" [height]="extenderLength"
                                        [isInput]="false"
                                        [inputValue]="calculatorService.extenderLength"
                                    ></app-measuring-stick>
                                </div>
                            <div *ngFor="let p of persons.positions; trackBy: personTrackByFn" class="person-wrapper" @animateOutputArea
                                [ngStyle]="{'width': presenterWidth + 'px', 'left': p.positionPercentage + '%'}">
                                <app-svg-standing-person></app-svg-standing-person>
                            </div>
                            <div *ngFor="let mic of microphones.positions; trackBy: microphoneTrackByFn" @animateOutputArea 
                                class="microphone-wrapper" 
                                [ngStyle]="{'width': captureWidthPercentage + '%', 'left': mic.positionPercentage + '%'}">
                                <app-svg-microphone [extenderLength]="extenderLength"></app-svg-microphone>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="graphical-output-side">
        <div class="stage-info-wrapper">
            <div style="position: absolute; top: 0; left: 10%;">
                <app-measuring-stick orientation="vertical" [height]="350"
                    [isInput]="true"
                    [inputMin]="CalculatorMins.ceilingHeight"
                    [inputMax]="CalculatorMaxes.ceilingHeight"
                    [inputValue]="calculatorService.ceilingHeight"
                    (updated)="updateInput('ceilingHeight', $event)"
                ></app-measuring-stick>
            </div>
            <div class="stage-wrapper">
                <div class="stage-outer-container">
                    <div class="stage-inner-container">
                        <div class="stage-side"></div>
                    </div>
                </div>   
            </div>
        </div>
    </div>
</div>
