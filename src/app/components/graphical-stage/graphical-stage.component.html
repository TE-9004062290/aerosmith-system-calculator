<div #wrapper class="stage-wrapper" [ngStyle]="{'width': halfSquare ? '75%' : '100%'}">
    <div #container class="stage-container">
        <div #stage class="stage" [ngStyle]="{'height': cHeight + 'px', 'width': majorAxis === 'height' || halfSquare ? cHeight * widthHeightRatio + 'px' : '90%'}">
            <div class="person-wrapper" [ngStyle]="{'width': presenterWidthPercentage + 'px'}">
                <app-svg-standing-person></app-svg-standing-person>
            </div>
            <div class="microphone-wrapper" [ngStyle]="{'width': captureWidthPercentage + '%'}">
                <app-svg-microphone></app-svg-microphone>
            </div>
            <div class="microphone-wrapper" [ngStyle]="{'width': captureWidthPercentage + '%'}">
                <app-svg-microphone></app-svg-microphone>
            </div>
            <div class="microphone-wrapper" [ngStyle]="{'width': captureWidthPercentage + '%'}">
                <app-svg-microphone></app-svg-microphone>
            </div>
            <div class="lecture-width-ruler ruler-horizontal">
                <div class="bar"></div>
                <input id="lecture-width" class="inputs-input" type="number" 
                    [min]="CalculatorMins.lectureWidth"
                    [max]="CalculatorMaxes.lectureWidth"
                    [(ngModel)]="calculatorService.lectureWidth"/>
                <div class="bar"></div>
            </div>
        </div>
    </div>
    <div class="vertical-bar" [ngStyle]="{'height': cHeight + 'px'}"></div>
</div>

<div class="debug-stats">
    <div>
        Major Axis: {{ majorAxis }}
    </div>
    <div>
        Width/Height Ratio: {{ widthHeightRatio }}
    </div>
    <div>
        Stage Width Percentage: {{ stageWidthPercentage }}%
    </div>
    <div>
        Stage Height Percentage: {{ stageHeightPercentage }}%
    </div>
    <div>
        Stage Vertical Offset {{ stageTopOffsetPercentage }}%
    </div>
</div>
