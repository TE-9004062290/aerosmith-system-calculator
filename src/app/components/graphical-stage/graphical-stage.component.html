<div class="graphical-output" [ngClass]="{'has-output': calculatorService.hasFreshOutput}" [attr.app-display-mode]="RatioModeEnum[ratioMode] | lowercase">
    <div class="graphical-output-front">
        <div class="stage-info-wrapper">
            <div class="measuring-stick-overlay" style="position: absolute; top: 0; left: 10%;">
                <app-measuring-stick orientation="vertical" 
                    [height]="stageHeight"
                    thinModeDirection="left"
                    [isInput]="true"
                    [inputMin]="CalculatorMins.ceilingHeight"
                    [inputMax]="CalculatorMaxes.ceilingHeight"
                    [inputValue]="calculatorService.ceilingHeight"
                    (updated)="updateInput('ceilingHeight', $event)"
                ></app-measuring-stick>
            </div>
            <div class="measuring-stick-overlay presenter-height">
                <app-measuring-stick orientation="vertical" 
                    [height]="presenterWidth / graphicsService.presenterWidthHeight"
                    thinModeDirection="right"
                    [isInput]="true"
                    [inputMin]="CalculatorMins.presenterHeight"
                    [inputMax]="CalculatorMaxes.presenterHeight"
                    step="0.1"
                    [inputValue]="calculatorService.presenterHeight"
                    (updated)="updateInput('presenterHeight', $event)"
                ></app-measuring-stick>
            </div>
            <div *ngIf="calculatorService.hasFreshOutput && extenderLength > 0" class="measuring-stick-overlay extender-length" @animateOutputArea>
                <app-measuring-stick orientation="vertical" 
                    [height]="extenderLength"
                    thinModeDirection="right"
                    [isInput]="!calculatorService.extenderRequired"
                    step="0.5"
                    [inputValue]="calculatorService.extenderLength"
                    (updated)="updateInput('inputExtenderLength', $event)"
                ></app-measuring-stick>
            </div>
            <div class="measuring-stick-overlay lectureWidth" style="position: absolute; margin: 0 auto; bottom: -40px; width: 100%;">
                <app-measuring-stick orientation="horizontal" 
                    [width]="stageWidth"
                    maxWidth='56.7%'
                    thinModeDirection="bottom"
                    [isInput]="true" 
                    [inputMin]="CalculatorMins.lectureWidth"
                    [inputMax]="CalculatorMaxes.lectureWidth"
                    [inputValue]="calculatorService.lectureWidth"
                    (updated)="updateInput('lectureWidth', $event)"
                ></app-measuring-stick>
            </div>
            <ng-container *ngIf="calculatorService.hasFreshOutput">
                <ng-container *ngIf="microphones.positions && microphones.positions.length % 2 === 0">
                    <div class="measuring-stick-overlay" style="position: absolute; margin: 0 auto; top: -30px; width: 100%;" @animateOutputArea >
                        <app-measuring-stick orientation="horizontal" 
                            [width]="calculatorService.microphoneInterval * stageWidth / calculatorService.lectureWidth"
                            [maxWidth]="(calculatorService.microphoneInterval * 56.7 / calculatorService.lectureWidth) + '%'"
                            thinModeDirection="top"
                            [isInput]="false" 
                            [inputValue]="calculatorService.microphoneInterval"
                        ></app-measuring-stick>
                    </div>
                </ng-container>
                <ng-container *ngIf="microphones.positions && microphones.positions.length % 2 === 1 && microphones.positions.length > 1">
                    <div class="measuring-stick-overlay" style="position: absolute; top: -30px; width: 100%;" @animateOutputArea >
                        <app-measuring-stick orientation="horizontal" 
                            [width]="calculatorService.microphoneInterval * stageWidth / calculatorService.lectureWidth"
                            [maxWidth]="(calculatorService.microphoneInterval * 56.7 / calculatorService.lectureWidth) + '%'"
                            [twinned]="true"
                            thinModeDirection="top"
                            [isInput]="false" 
                            [inputValue]="calculatorService.microphoneInterval"
                        ></app-measuring-stick>
                    </div>
                </ng-container>
            </ng-container>
            <div #wrapper class="stage-wrapper" [attr.app-display-mode]="RatioModeEnum[ratioMode] | lowercase">
                <div class="stage-label">Front view</div>
                <div class="stage-outer-container">
                    <div #container class="stage-inner-container">
                        <div #stage class="stage" [ngStyle]="{'height': stageHeight + 'px', 'width': stageWidth + 'px'}">
                            <ng-container *ngIf="!calculatorService.hasFreshOutput">
                                <div class="person-wrapper left-anchor" [ngStyle]="{'width': presenterWidth + 'px'}" style="left: 0%;" @animateOutputArea>
                                    <app-svg-standing-person></app-svg-standing-person>
                                </div>
                                <div class="person-wrapper center-anchor" [ngStyle]="{'width': presenterWidth + 'px'}" style="left: 50%;" @animateOutputArea>
                                    <app-svg-standing-person></app-svg-standing-person>
                                </div>
                                <div class="person-wrapper right-anchor" [ngStyle]="{'width': presenterWidth + 'px'}" style="left: 100%;" @animateOutputArea>
                                    <app-svg-standing-person></app-svg-standing-person>
                                </div>
                            </ng-container>
                            <ng-container *ngIf="calculatorService.hasFreshOutput">
                                <div *ngFor="let p of persons.positions; trackBy: personTrackByFn" class="person-wrapper" @animateOutputArea
                                    [ngStyle]="{'width': presenterWidth + 'px', 'left': p.positionPercentage + '%'}">
                                    <app-svg-standing-person></app-svg-standing-person>
                                </div>
                            </ng-container>
                            <ng-container *ngIf="calculatorService.hasFreshOutput && (calculatorService.reinforcePresenter || calculatorService.recordPresenter)">
                                <div *ngFor="let mic of microphones.positions; trackBy: microphoneTrackByFn" @animateOutputArea 
                                    class="microphone-wrapper" 
                                    [ngStyle]="{'width': (2 * sideCapture) + 'px', 'left': mic.positionPercentage + '%'}">
                                    <app-svg-microphone 
                                        [displayRadius]="calculatorService.displayPresenterReinforcement"
                                        [mode]="calculatorService.reinforcePresenter ? 'reinforcement' : 'presenterRecording'" 
                                        [extenderLength]="extenderLength">
                                    </app-svg-microphone>
                                </div>
                                <ng-container *ngIf="calculatorService.recordPresenter && calculatorService.reinforcePresenter">
                                    <div *ngFor="let mic of microphones.positions; trackBy: microphoneTrackByFn" @animateOutputArea 
                                        class="microphone-wrapper" 
                                        [ngStyle]="{'width': (2 * secondarySideCapture) + 'px', 'left': mic.positionPercentage + '%'}">
                                        <app-svg-microphone 
                                            [displayRadius]="calculatorService.displayPresenterRecording"
                                            mode="presenterRecording" 
                                            [extenderLength]="extenderLength">
                                        </app-svg-microphone>
                                    </div>  
                                </ng-container>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <app-graphical-stage-side></app-graphical-stage-side>
    <app-graphical-stage-top *ngIf="calculatorService.recordAudience"></app-graphical-stage-top>
</div>
