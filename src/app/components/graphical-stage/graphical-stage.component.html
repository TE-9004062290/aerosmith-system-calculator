<div class="graphical-output" [attr.app-display-mode]="RatioModeEnum[ratioMode] | lowercase">
    <div class="graphical-output-front">
        <div class="stage-info-wrapper">
            <div class="measuring-stick-overlay" style="position: absolute; top: 0; left: 10%;">
                <app-measuring-stick orientation="vertical" 
                    [height]="stageHeight"
                    thinModeDirection="left"
                    [isInput]="true"
                    [inputMin]="CalculatorMins.ceilingHeight"
                    [inputMax]="CalculatorMaxes.ceilingHeight"
                    [inputValue]="calculatorService.ceilingHeight"
                    (updated)="updateInput('ceilingHeight', $event)"
                ></app-measuring-stick>
            </div>
            <div class="measuring-stick-overlay" style="position: absolute; bottom: 0; left: 86%">
                <app-measuring-stick orientation="vertical" 
                    [height]="presenterWidth / graphicsService.presenterWidthHeight"
                    thinModeDirection="right"
                    [isInput]="true"
                    [inputMin]="CalculatorMins.presenterHeight"
                    [inputMax]="CalculatorMaxes.presenterHeight"
                    step="0.1"
                    [inputValue]="calculatorService.presenterHeight"
                    (updated)="updateInput('presenterHeight', $event)"
                ></app-measuring-stick>
            </div>
            <div *ngIf="calculatorService.hasFreshOutput && extenderLength > 0" class="measuring-stick-overlay" @animateOutputArea
                style="position: absolute; top: 0; left: 86%">
                <app-measuring-stick orientation="vertical" 
                    [height]="extenderLength"
                    thinModeDirection="right"
                    [isInput]="!calculatorService.extenderRequired"
                    step="0.5"
                    [inputValue]="calculatorService.extenderLength"
                    (updated)="updateInput('inputExtenderLength', $event)"
                ></app-measuring-stick>
            </div>
            <div class="measuring-stick-overlay lectureWidth" style="position: absolute; margin: 0 auto; bottom: -40px; width: 100%;">
                <app-measuring-stick orientation="horizontal" 
                    [width]="stageWidth"
                    maxWidth='56.7%'
                    thinModeDirection="bottom"
                    [isInput]="true" 
                    [inputMin]="CalculatorMins.lectureWidth"
                    [inputMax]="CalculatorMaxes.lectureWidth"
                    [inputValue]="calculatorService.lectureWidth"
                    (updated)="updateInput('lectureWidth', $event)"
                ></app-measuring-stick>
            </div>
            <ng-container *ngIf="calculatorService.hasFreshOutput">
                <ng-container *ngIf="microphones.positions && microphones.positions.length % 2 === 0">
                    <div class="measuring-stick-overlay" style="position: absolute; margin: 0 auto; top: -40px; width: 100%;" @animateOutputArea >
                        <app-measuring-stick orientation="horizontal" 
                            [width]="calculatorService.microphoneInterval * stageWidth / calculatorService.lectureWidth"
                            [maxWidth]="(calculatorService.microphoneInterval * 56.7 / calculatorService.lectureWidth) + '%'"
                            thinModeDirection="top"
                            [isInput]="false" 
                            [inputValue]="calculatorService.microphoneInterval"
                        ></app-measuring-stick>
                    </div>
                </ng-container>
                <ng-container *ngIf="microphones.positions && microphones.positions.length % 2 === 1 && microphones.positions.length > 1">
                    <div class="measuring-stick-overlay" style="position: absolute; top: -40px; width: 100%;" @animateOutputArea >
                        <app-measuring-stick orientation="horizontal" 
                            [width]="calculatorService.microphoneInterval * stageWidth / calculatorService.lectureWidth"
                            [maxWidth]="(calculatorService.microphoneInterval * 56.7 / calculatorService.lectureWidth) + '%'"
                            [twinned]="true"
                            thinModeDirection="top"
                            [isInput]="false" 
                            [inputValue]="calculatorService.microphoneInterval"
                        ></app-measuring-stick>
                    </div>
                </ng-container>
            </ng-container>
            <div #wrapper class="stage-wrapper" [attr.app-display-mode]="RatioModeEnum[ratioMode] | lowercase">
                <div class="stage-label">Front view</div>
                <div class="stage-outer-container">
                    <div #container class="stage-inner-container">
                        <div #stage class="stage" [ngStyle]="{'height': stageHeight + 'px', 'width': stageWidth + 'px'}">
                            <ng-container *ngIf="!calculatorService.hasFreshOutput">
                                <div class="person-wrapper left-anchor" [ngStyle]="{'width': presenterWidth + 'px'}" style="left: 0%;" @animateOutputArea>
                                    <app-svg-standing-person></app-svg-standing-person>
                                </div>
                                <div class="person-wrapper center-anchor" [ngStyle]="{'width': presenterWidth + 'px'}" style="left: 50%;" @animateOutputArea>
                                    <app-svg-standing-person></app-svg-standing-person>
                                </div>
                                <div class="person-wrapper right-anchor" [ngStyle]="{'width': presenterWidth + 'px'}" style="left: 100%;" @animateOutputArea>
                                    <app-svg-standing-person></app-svg-standing-person>
                                </div>
                            </ng-container>
                            <ng-container *ngIf="calculatorService.hasFreshOutput">
                                <div *ngFor="let p of persons.positions; trackBy: personTrackByFn" class="person-wrapper" @animateOutputArea
                                    [ngStyle]="{'width': presenterWidth + 'px', 'left': p.positionPercentage + '%'}">
                                    <app-svg-standing-person></app-svg-standing-person>
                                </div>
                            </ng-container>
                            <ng-container *ngIf="calculatorService.hasFreshOutput">
                                <div *ngFor="let mic of microphones.positions; trackBy: microphoneTrackByFn" @animateOutputArea 
                                    class="microphone-wrapper" 
                                    [ngStyle]="{'width': (2 * sideCapture) + 'px', 'left': mic.positionPercentage + '%'}">
                                    <app-svg-microphone [extenderLength]="extenderLength"></app-svg-microphone>
                                </div>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="graphical-output-side">
        <div class="stage-info-wrapper" [ngStyle]="{'height': stageHeight + 'px'}">
            <div class="measuring-stick-overlay" style="position: absolute; top: 0; left: 10%;">
                <app-measuring-stick orientation="vertical" [height]="stageHeight"
                    [isInput]="true"
                    thinModeDirection="left"
                    [inputMin]="CalculatorMins.ceilingHeight"
                    [inputMax]="CalculatorMaxes.ceilingHeight"
                    [inputValue]="calculatorService.ceilingHeight"
                    (updated)="updateInput('ceilingHeight', $event)"
                ></app-measuring-stick>
            </div>
            <div class="measuring-stick-overlay" style="position: absolute; bottom: 0; left: 86%;">
                <app-measuring-stick orientation="vertical" [height]="stageHeight * calculatorService.audienceHeight / calculatorService.ceilingHeight"
                    [isInput]="true"
                    thinModeDirection="right"
                    [inputMin]="CalculatorMins.audienceHeight"
                    [inputMax]="CalculatorMaxes.audienceHeight"
                    step="0.1"
                    [inputValue]="calculatorService.audienceHeight"
                    (updated)="updateInput('audienceHeight', $event)"
                ></app-measuring-stick>
            </div>
            <div #sideWrapper class="stage-wrapper">
                <div *ngIf="calculatorService.hasFreshOutput" @animateOutputArea
                    class="measuring-stick-overlay audience-distance-side" 
                    [ngStyle]="{'left': ((sideCapture / 2) + ((sideWrapperWidth - sideInnerContainerWidth)/2)) + 'px'}">
                    <app-measuring-stick orientation="horizontal"
                        [width]="audienceDistance"
                        thinModeDirection="bottom"
                        [isInput]="false" 
                        [inputValue]="calculatorService.audienceDistance"
                    ></app-measuring-stick>
                    <div class="warning">
                        <span class="warning-icon"><app-svg-icons iconType="warning"></app-svg-icons></span>
                        <span class="warning-text">Loud audience sounds may be recorded if closer than this distance</span>
                    </div>
                </div>
                <div class="stage-outer-container">
                    <div class="stage-label">Side view</div>
                    <div #sideInnerContainer class="stage-inner-container">
                        <div class="stage-side">
                            <div class="person-wrapper" @animateOutputArea
                                [ngStyle]="{'width': presenterSideWidth + 'px', 'left': (sideCapture / 2) + 'px'}">
                                <app-svg-standing-person mode="side"></app-svg-standing-person>
                            </div>
                            <div class="audience-wrapper">
                                <div *ngFor="let a of audience; trackBy: audienceTrackByFn" class="person-wrapper" @animateOutputArea
                                    [ngStyle]="{'width': audienceWidth + 'px', 'left': a.positionPercentage + 'px'}">
                                    <app-svg-standing-person mode="sitting"></app-svg-standing-person>
                                </div>
                            </div>
                            <div *ngIf="calculatorService.hasFreshOutput" class="microphone-wrapper" @animateOutputArea                  
                                [ngStyle]="{'width': (2 * sideCapture) + 'px', 'left': (sideCapture / 2) + 'px', 'position': 'absolute'}">
                                <app-svg-microphone [calculationPriority]="calculatorService.calculationPriority" [extenderLength]="extenderLength"></app-svg-microphone>
                            </div>
                        </div>
                    </div>
                </div>   
            </div>
        </div>
    </div>
</div>
