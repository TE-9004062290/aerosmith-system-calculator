<div #wrapper class="stage-wrapper" [ngStyle]="{'width': halfSquare ? '75%' : '100%'}">
    <div #container class="stage-container">
        <div #stage class="stage" [ngStyle]="{'height': cHeight + 'px', 'width': majorAxis === 'height' || halfSquare ? cHeight * widthHeightRatio + 'px' : '100%'}">
            <div class="person-wrapper" [ngStyle]="{'width': presenterWidthPercentage + 'px'}">
                <app-svg-standing-person></app-svg-standing-person>
            </div>
            <div class="microphone-wrapper" [ngStyle]="{'width': captureWidthPercentage + '%', 'left': capturePosition + '%'}">
                <app-svg-microphone></app-svg-microphone>
            </div>
            <div class="microphone-wrapper" [ngStyle]="{'width': captureWidthPercentage + '%', 'left': capturePosition + '%'}">
                <app-svg-microphone></app-svg-microphone>
            </div>
            <div class="lecture-width-ruler ruler-horizontal">
                <div class="bar"></div>
                <input id="lecture-width" #inputWidth class="inputs-input" type="number" 
                    [min]="CalculatorMins.lectureWidth"
                    [max]="CalculatorMaxes.lectureWidth"
                    [value]="calculatorService.lectureWidth"
                    (change)="updateInput('lectureWidth', inputWidth)"/>
                <div class="bar"></div>
            </div>
        </div>
    </div>
    <div class="vertical-bar" [ngStyle]="{'height': cHeight + 'px'}"></div>
</div>

<div class="debug-stats">
    <!-- <div>
        Major Axis: {{ majorAxis }}
    </div> -->
    <div>Page Height: {{ pageHeight }}</div>
    <div>
        Height: {{ cHeight + 'px' }}
    </div>
    <div>
        Width: {{ majorAxis === 'height' || halfSquare ? cHeight * widthHeightRatio + 'px' : '100%' }}
    </div>
    <div>
        StageWidth: {{ stageWidth }}
    </div>
    <div>
        Width/Height Ratio: {{ widthHeightRatio }}
    </div>
    <div>
        Half Square: {{ halfSquare }}
    </div>
</div>
