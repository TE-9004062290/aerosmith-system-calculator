<div class="graphical-stage-container">
    <div class="resizer-grid">
        <div class="main" style="border: solid black 1px" 
            [ngStyle]="{'width': stageWidth + '%', 'height': stageHeight + '%', 'top': top + '%'}" >
            <app-svg-standing-person [width]="presenterHeight + '%'" style="position: absolute; bottom: 0; width: 100%;"></app-svg-standing-person>
        </div>
    </div>
</div>
<div>
    <div>{{ ratio }}</div>
    <div>
        {{ majorAxis }}
    </div>
    <div>
        {{ stageWidth }}
    </div>
    <div>
        {{ stageHeight }}
    </div>
    <div>
        {{ top }}
    </div>
</div>
