<div class="graphical-stage-container">
    <div #container class="resizer-grid" [ngStyle]="{'top': '-' + stageTopOffsetPercentage + '%'}">
        <div class="dummy"></div>
        <div #resizer class="main" 
            [ngStyle]="{'width': stageWidthPercentage + '%', 'height': stageHeightPercentage + '%', 'top': stageTopOffsetPercentage + '%'}" >
            <div class="person-wrapper" [ngStyle]="{'width': presenterWidthPercentage + 'px'}">
                <app-svg-standing-person></app-svg-standing-person>
            </div>
        </div>
    </div>
</div>
<div class="graphical-stage-container">
    <div class="resizer-grid" [ngStyle]="{'top': '-' + stageTopOffsetPercentage + '%'}">
        <div class="dummy"></div>
        <div class="main" 
            [ngStyle]="{'width': stageWidthPercentage + '%', 'height': stageHeightPercentage + '%', 'top': stageTopOffsetPercentage + '%'}" >
            <div class="person-wrapper" [ngStyle]="{'width': presenterWidthPercentage + 'px'}">
                <app-svg-standing-person></app-svg-standing-person>
            </div>
        </div>
    </div>
</div>
<div>
    <div>
        Major Axis: {{ majorAxis }}
    </div>
    <div>
        Width/Height Ratio: {{ widthHeightRatio }}
    </div>
    <div>
        Stage Width Percentage: {{ stageWidthPercentage }}%
    </div>
    <div>
        Stage Height Percentage: {{ stageHeightPercentage }}%
    </div>
    <div>
        Stage Vertical Offset {{ stageTopOffsetPercentage }}%
    </div>
</div>
