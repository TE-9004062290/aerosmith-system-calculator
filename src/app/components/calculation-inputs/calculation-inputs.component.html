<div class="inputs-container">
    <div class="inputs-group inputs-group--horizontal">
        <label class="inputs-label" for="ceiling-height">
            Ceiling Height (H)
        </label>
        <div class="inputs-value">
            <input id="ceiling-height" class="inputs-input" [(ngModel)]="inputGroup.ceilingHeight" type="number" min="0"/>
            <span class="unit-label">
                {{ measurementUnit }} 
            </span>
        </div>
    </div>
    <div class="inputs-group inputs-group--horizontal">
        <label class="inputs-label" for="lecture-width">
            Width of Lecture Area (W)
        </label>
        <div class="inputs-value">
            <input id="lecture-width" class="inputs-input" [(ngModel)]="inputGroup.lectureWidth" type="number" min="0"/>
            <span class="unit-label">
                {{ measurementUnit }} 
            </span>
        </div>
    </div>
    <div class="inputs-group inputs-group--horizontal">
        <label class="inputs-label" for="presenter-height">
            Presenter's Height (T1)
        </label>
        <div class="inputs-value">
            <input id="presenter-height" class="inputs-input" [(ngModel)]="inputGroup.presenterHeight" type="number" min="0"/>
            <span class="unit-label">
                {{ measurementUnit }} 
            </span>
        </div>
    </div>
    <div class="inputs-group inputs-group--horizontal">
        <label class="inputs-label" for="audience-height">
            Audience's Height (T2)
        </label>
        <div class="inputs-value">
            <input id="audience-height" class="inputs-input" [(ngModel)]="inputGroup.audienceHeight" type="number" min="0"/>
            <span class="unit-label">
                {{ measurementUnit }} 
            </span>
        </div>
    </div>
</div>

<div style="width: fit-content;">
    <app-slide-toggle 
        [leftOption]="MeasurementUnitsEnum.Meters" 
        [rightOption]="MeasurementUnitsEnum.Feet" 
        [(ngModel)]="inputGroup.measurementUnit" 
        (ngModelChange)="changeUnits($event)">
    </app-slide-toggle>
</div>
