<div class="radio-toggle-container" (click)="toggle()">
    <div class="radio-toggle-label">{{ toggleLabel }}</div>
    <div class="radio-toggle-options">
        <div class="radio-toggle-option">
            <input class="radio-option" type="radio" [name]="toggleName" [value]="leftOption" [checked]="selectedOption === 'left'"/> 
            <span class="radio-option-label">{{ leftLabel || leftOption }}</span>
        </div>
        <div class="radio-toggle-option">
            <input class="radio-option" type="radio" [name]="toggleName" [value]="rightOption" [checked]="selectedOption === 'right'"/> 
            <span class="radio-option-label">{{ rightLabel || rightOption }}</span>
        </div>
    </div>
</div>
