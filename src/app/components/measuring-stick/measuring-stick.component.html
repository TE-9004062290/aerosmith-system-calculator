<ng-container [ngSwitch]="orientation">
    <div *ngSwitchCase="'horizontal'" class="horizontal-measure" [ngClass]="{'measurable-input': isInput}" [ngStyle]="{'width': width + 'px'}">
        <div class="stick left">
            <div class="stop"></div>
            <div class="arrow">
                <svg width="13" height="13" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 8L-8.74226e-07 4L8 -7.94784e-07L8 8Z" fill="#006DB3"/>
                </svg>        
            </div>
            <div class="bar"></div>
        </div>
        <input #inputElement class="inputs-input" type="number" 
            [min]="inputMin"
            [max]="inputMax"
            [value]="inputValue"
            (change)="onInputChange(inputElement)"/>
        <div class="stick right">
            <div class="bar"></div>
            <div class="arrow">
                <svg width="13" height="13" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 1.04908e-06L8 4L1.04907e-06 8L0 1.04908e-06Z" fill="#006DB3"/>
                </svg>
            </div>
            <div class="stop"></div>
        </div>
    </div>
    <div *ngSwitchCase="'vertical'" class="vertical-measure" [ngClass]="{'measurable-input': isInput}" [ngStyle]="{'height': height + 'px'}">
        <div class="stick top">
            <div class="arrow">
                <svg width="13" height="13" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1.39877e-06 8L4 -6.99381e-07L8 8L1.39877e-06 8Z" fill="#006DB3"/>
                </svg>         
            </div>
            <div class="bar"></div>
        </div>
        <input #inputElement class="inputs-input" type="number" 
            [min]="inputMin"
            [max]="inputMax"
            [value]="inputValue"
            (change)="onInputChange(inputElement)"/>
        <div class="stick bottom">
            <div class="bar"></div>
            <div class="arrow">
                <svg width="13" height="13" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 0L4 8L-2.22546e-07 6.99382e-07L8 0Z" fill="#006DB3"/>
                </svg>           
            </div>
        </div>
    </div>
</ng-container>
