<ng-container [ngSwitch]="orientation">
    <ng-container *ngSwitchCase="'horizontal'">
        <div class="horizontal-wrapper" [ngClass]="{'twinned': twinned}">
            <ng-container [ngTemplateOutlet]="horizontal"></ng-container>
            <ng-container *ngIf="twinned" [ngTemplateOutlet]="horizontal"></ng-container>
        </div>
    </ng-container>
    <ng-container *ngSwitchCase="'vertical'">
        <div class="vertical-wrapper">
            <ng-container [ngTemplateOutlet]="vertical"></ng-container>
        </div>
    </ng-container>
</ng-container>

<ng-template #horizontal>
    <div [attr.mode]="mode" [attr.mode-direction]="thinModeDirection"
    class="horizontal-measure" [ngClass]="{'measurable-input': isInput, 'measurable-output': !isInput}" 
        [ngStyle]="{'width': width + 'px', 'max-width': maxWidth}">
        <div class="stick left">
            <div class="stop"></div>
            <div class="arrow">     
            </div>
            <div class="bar"></div>
        </div>
        <div *ngIf="isInput" class="inputs-input" type="number">
            <input type="number" #inputElement
                [min]="inputMin"
                [max]="inputMax"
                [step]="step"
                [value]="inputValue | number: '0.2-2'"
                (change)="onInputChange(inputElement)"
            />
            <div class="measurement-unit">
                {{ calculatorService.measurementUnit.toString() }}
            </div>
        </div>
        <div *ngIf="!isInput" class="inputs-output">
            <div class="output-value">
                {{ inputValue | number: '0.2-2' }} {{ calculatorService.measurementUnit.toString() }}
            </div>
        </div>
        <div class="stick right">
            <div class="bar"></div>
            <div class="arrow">
            </div>
            <div class="stop"></div>
        </div>
    </div>
</ng-template>

<ng-template #vertical>
    <div [attr.mode]="mode" [attr.mode-direction]="thinModeDirection" class="vertical-measure" 
        [ngClass]="{'measurable-input': isInput, 'measurable-output': !isInput}" 
        [ngStyle]="{'height': height + 'px'}">
        <div class="stick top">
            <div class="arrow"></div>
            <div class="bar"></div>
        </div>
        <div *ngIf="isInput" class="inputs-input" type="number" [ngStyle]="{'top': mode === 'thin' ? ((height - 22) / 2) + 'px' : undefined}">
            <input type="number" #inputElement
                [min]="inputMin"
                [max]="inputMax"
                [step]="step"
                [value]="inputValue | number: '0.2-2'"
                (change)="onInputChange(inputElement)"
            />
            <div class="measurement-unit">
                {{ calculatorService.measurementUnit.toString() }}
            </div>
        </div>
        <div *ngIf="!isInput" class="inputs-output" [ngStyle]="{'top': mode === 'thin' ? ((height - 22) / 2) + 'px' : undefined}">
            <div class="output-value">
                {{ inputValue | number: '0.2-2'}} {{ calculatorService.measurementUnit.toString() }}
            </div>
        </div>
        <div class="stick bottom">
            <div class="bar"></div>
            <div class="arrow"></div>
        </div>
    </div>
</ng-template>
