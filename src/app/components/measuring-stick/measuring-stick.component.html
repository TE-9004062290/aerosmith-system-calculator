<ng-container [ngSwitch]="orientation">
    <div *ngSwitchCase="'horizontal'" class="horizontal-measure" [ngClass]="{'measurable-input': isInput}" [ngStyle]="{'width': width + 'px'}">
        <div class="stick left">
            <div class="stop"></div>
            <div class="arrow">     
            </div>
            <div class="bar"></div>
        </div>
        <input *ngIf="isInput" #inputElement class="inputs-input" type="number" 
            [min]="inputMin"
            [max]="inputMax"
            [value]="inputValue"
            (change)="onInputChange(inputElement)"/>
        <div *ngIf="!isInput" class="inputs-output">
            <div class="output-value">
                {{ inputValue }} {{ calculatorService.measurementUnit.toString() }}
            </div>
        </div>
        <div class="stick right">
            <div class="bar"></div>
            <div class="arrow">
            </div>
            <div class="stop"></div>
        </div>
    </div>
    <div *ngSwitchCase="'vertical'" class="vertical-measure" [ngClass]="{'measurable-input': isInput}" [ngStyle]="{'height': height + 'px'}">
        <div class="stick top">
            <div class="arrow"></div>
            <div class="bar"></div>
        </div>
        <input *ngIf="isInput" #inputElement class="inputs-input" type="number" 
            [min]="inputMin"
            [max]="inputMax"
            [value]="inputValue"
            (change)="onInputChange(inputElement)"/>
        <div *ngIf="!isInput" class="inputs-output">
            <div class="output-value">
                {{ inputValue }} {{ calculatorService.measurementUnit.toString() }}
            </div>
        </div>
        <div class="stick bottom">
            <div class="bar"></div>
            <div class="arrow"></div>
        </div>
    </div>
</ng-container>
