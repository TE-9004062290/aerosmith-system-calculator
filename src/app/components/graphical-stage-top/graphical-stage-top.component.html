<div class="graphical-output-top">
    <div class="stage-info-wrapper">
        <div class="measuring-stick-overlay audience-depth" [ngStyle]="{'top': depthOffset + 'px'}" style="position: absolute; left: 10%;">
            <app-measuring-stick orientation="vertical" 
                [height]="audienceDepth"
                thinModeDirection="left"
                [isInput]="true"
                [inputMin]="CalculatorMins.audienceDepth"
                [inputMax]="CalculatorMaxes.audienceDepth"
                [inputValue]="calculatorService.audienceDepth"
                (updated)="updateInput('audienceDepth', $event)"
            ></app-measuring-stick>
        </div>
        <div class="measuring-stick-overlay lectureWidth" style="position: absolute; margin: 0 auto; bottom: -40px; width: 100%;">
            <app-measuring-stick orientation="horizontal" 
                [width]="stageWidth"
                maxWidth='56.7%'
                thinModeDirection="bottom"
                [isInput]="true" 
                [inputMin]="CalculatorMins.lectureWidth"
                [inputMax]="CalculatorMaxes.lectureWidth"
                [inputValue]="calculatorService.lectureWidth"
                (updated)="updateInput('lectureWidth', $event)"
            ></app-measuring-stick>
        </div>

        <div #wrapper class="stage-wrapper" [attr.app-display-mode]="RatioModeEnum[ratioMode] | lowercase">
            <div class="stage-label">Top view</div>
            <div class="stage-outer-container">
                <div #container class="stage-inner-container">
                    <div #stage class="stage" [ngStyle]="{'height': stageHeight + 'px', 'width': stageWidth + 'px'}">
                        <ng-container *ngIf="true || !calculatorService.hasFreshOutput">
                            <div class="person-wrapper left-anchor" [ngStyle]="{'width': presenterWidth + 'px'}" style="top: 0%; left: 0%;" @animateOutputArea>
                                <app-svg-standing-person mode="top"></app-svg-standing-person>
                            </div>
                            <div class="person-wrapper center-anchor" [ngStyle]="{'width': presenterWidth + 'px'}" style="top: 0%; left: 50%;" @animateOutputArea>
                                <app-svg-standing-person mode="top"></app-svg-standing-person>
                            </div>
                            <div class="person-wrapper right-anchor" [ngStyle]="{'width': presenterWidth + 'px'}" style="top: 0%; left: 100%;" @animateOutputArea>
                                <app-svg-standing-person mode="top"></app-svg-standing-person>
                            </div>
                        </ng-container>
                        <div class="audience-wrapper">
                            <div *ngFor="let a of audienceArray; trackBy: audienceTrackByFn" class="person-wrapper" @animateOutputArea
                                [ngStyle]="{'width': audienceWidth + 'px', 'left': a.positionPercentage + 'px', 'top': a.positionPercentageVertical + 'px'}">
                                <app-svg-standing-person mode="sitting-top"></app-svg-standing-person>
                            </div>
                        </div>
                        <!-- <ng-container *ngIf="calculatorService.hasFreshOutput">

                                <app-svg-standing-person></app-svg-standing-person>

                        <ng-container *ngIf="calculatorService.hasFreshOutput">
                            <div *ngFor="let mic of microphones.positions; trackBy: microphoneTrackByFn" @animateOutputArea

                                [ngStyle]="{'width': (2 * sideCapture) + 'px', 'left': mic.positionPercentage + '%'}">

                    </div>

            </div>
        </div>
    </div>
</div>
