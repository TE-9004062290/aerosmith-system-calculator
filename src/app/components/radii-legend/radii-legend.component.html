<div class="radii-legends">
    <div class="radii-legend" (mouseenter)="togglePresenterReinforcement(false)" (mouseleave)="togglePresenterReinforcement(true)">
        <div class="legend-icon" [ngStyle]="{'background-color': '#66F3CB'}"></div>
        <div class="legend-label">
            Presenter sound reinforcement
        </div>
    </div>
    <div class="radii-legend" (mouseenter)="togglePresenterRecording(false)" (mouseleave)="togglePresenterRecording(true)">
        <div class="legend-icon" [ngStyle]="{'background-color': '#EEA230', 'opacity': 0.06}"></div>
        <div class="legend-label">
            Presenter recording
        </div>
    </div>
    <div class="radii-legend" (mouseenter)="toggleAudienceRecording(false)" (mouseleave)="toggleAudienceRecording(true)">
        <div class="legend-icon" [ngStyle]="{'background-color': '#C0F4F4'}"></div>
        <div class="legend-label">
            Audience recording
        </div>
    </div>
</div>
