<div class="radii-legends">
    <div *ngIf="calculatorService.reinforcePresenter" class="radii-legend" (mouseenter)="togglePresenterReinforcement(false)" (mouseleave)="togglePresenterReinforcement(true)">
        <div class="legend-icon" [ngStyle]="{'background-color': '#66F3CB'}"></div>
        <div class="legend-label">
            Presenter sound reinforcement
        </div>
    </div>
    <div *ngIf="calculatorService.recordPresenter" class="radii-legend" (mouseenter)="togglePresenterRecording(false)" (mouseleave)="togglePresenterRecording(true)">
        <div class="legend-icon" [ngStyle]="{'background-color': '#EEA230', 'opacity': 0.1}"></div>
        <div class="legend-label">
            Presenter recording
        </div>
    </div>
    <div *ngIf="calculatorService.recordAudience" class="radii-legend" (mouseenter)="toggleAudienceRecording(false)" (mouseleave)="toggleAudienceRecording(true)">
        <div class="legend-icon" [ngStyle]="{'background-color': '#3BB0FF', 'opacity': 0.15}"></div>
        <div class="legend-label">
            Audience recording
        </div>
    </div>
</div>
